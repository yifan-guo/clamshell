version: "3.8"

services:
  stepca:
    image: smallstep/step-ca:latest
    container_name: stepca
    environment:
      DOCKER_STEPCA_INIT_NAME: "BatteryFleetCA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "stepca,localhost"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: "clamshell"
      DOCKER_STEPCA_INIT_PASSWORD: "demo-password-change-me"
    volumes:
      - stepca-data:/home/step
    ports:
      - "9000:9000"
    networks: [fleetnet]
    healthcheck:
      test: ["CMD-SHELL", "test -f /home/step/certs/root_ca.crt"]
      interval: 2s
      timeout: 2s
      retries: 30

  clamshell:
    build: ./clamshell
    container_name: clamshell
    depends_on:
      stepca:
        condition: service_healthy
    environment:
      STEPCA_URL: "https://stepca:9000"
      STEPCA_PASSWORD: "demo-password-change-me"
      STEPCA_PROVISIONER: "clamshell"
      # Point this at Canonical's real cloud image URL to download the genuine
      # OS. Left as a local placeholder so the demo works with no internet.
      OS_IMAGE_URL: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"
      OS_IMAGE_FALLBACK_LOCAL: "true"
    volumes:
      - stepca-data:/stepca:ro
      - clamshell-state:/state
      - ./clamshell-state-seed/placeholder-os-image.bin:/state/placeholder-os-image.bin:ro
    ports:
      - "8080:8080"
    networks: [fleetnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/bootstrap-bundle >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  fleet:
    build: ./fleet
    container_name: fleet
    depends_on:
      clamshell:
        condition: service_healthy
    environment:
      CLAMSHELL_URL: "http://clamshell:8080"
    ports:
      - "8081:8081"
    volumes:
      - fleet-state:/state
    networks: [fleetnet]

  battery:
    build: ./battery
    depends_on:
      clamshell:
        condition: service_healthy
      fleet:
        condition: service_started
    environment:
      CLAMSHELL_URL: "http://clamshell:8080"
      FLEET_URL: "http://fleet:8081"
    # LUKS + swtpm need loop devices and kernel crypto access.
    # This is why battery containers must run privileged — a real physical
    # unit doesn't need this, a container faking a physical unit does.
    privileged: true
    cap_add: [SYS_ADMIN]
    devices:
      - /dev/loop-control
    networks: [fleetnet]

networks:
  fleetnet:

volumes:
  stepca-data:
  clamshell-state:
  fleet-state:
